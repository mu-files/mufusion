name: Build and Test

# A release is published by publish.yml from this workflow's artifacts of
# the tagged commit on main, so a tag does not run this workflow.
on:
  push:
    branches: [main, dev-branch]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff==0.17.0"

      - name: Ruff check
        run: ruff check

      - name: Ruff format
        run: ruff format --check

  build-sdist:
    name: Build source distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      # setuptools prints a deprecation as BuildBackendWarning and still
      # exits 0. Fail the job so that warning is not only in the log.
      - name: Build sdists
        run: |
          set -o pipefail
          for project in mufusion muraw; do
            (cd "$project" && python -m build --sdist --outdir ../dist 2>&1 | tee "$RUNNER_TEMP/sdist-$project.log")
            if grep -q BuildBackendWarning "$RUNNER_TEMP/sdist-$project.log"; then
              echo "The $project sdist build printed a BuildBackendWarning." >&2
              exit 1
            fi
          done

      # Both projects build into one dist/ at the repo root. An artifact of
      # two directories keeps their paths, and the jobs that download it
      # read the files at the top of dist/.
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: ubuntu-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest
          # win_arm64 waits on opencv-python-headless publishing that wheel.
          # The engine binary is in the sdist; revisit when opencv is optional.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      # mufusion compiles nothing: one abi3 wheel per platform, holding
      # that platform's CoreEngine binary.
      - name: Build mufusion wheel
        run: python -m build --wheel --outdir ../dist
        working-directory: mufusion
        env:
          # Prebuilt CoreEngine binary requires macOS 14+
          MACOSX_DEPLOYMENT_TARGET: "14.0"

      # muraw is pure Python: the same py3-none-any wheel on every platform.
      - name: Build muraw wheel
        run: python -m build --wheel --outdir ../dist
        working-directory: muraw

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl

  test:
    name: Test (${{ matrix.name }})
    needs: [lint, build-wheels]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            artifact: wheels-ubuntu
            extras: "[all]"
          - name: ubuntu-arm64
            os: ubuntu-24.04-arm
            artifact: wheels-ubuntu-arm64
            extras: "[all]"
          - name: macos
            os: macos-15
            artifact: wheels-macos
            extras: "[all,coreimage]"
          - name: windows
            os: windows-latest
            artifact: wheels-windows
            extras: "[all]"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      # mufusion first, so muraw's dependency on it is met by the wheel
      # from this run rather than by a release on PyPI. muraw-demosaic is
      # not published; it is built here from the checkout, without RCD, so
      # the VNG tests run.
      - name: Install wheels and extras
        shell: bash
        run: |
          set -euo pipefail
          mufusion_whl=$(ls dist/mufusion-*.whl | head -n 1)
          muraw_whl=$(ls dist/muraw-*.whl | head -n 1)
          python -m pip install --upgrade pip
          echo "Installing ${mufusion_whl}"
          python -m pip install "${mufusion_whl}"
          echo "Installing ${muraw_whl}${EXTRAS}"
          python -m pip install "${muraw_whl}${EXTRAS}"
          python -m pip install ./muraw-demosaic
        env:
          EXTRAS: ${{ matrix.extras }}

      - name: Run pytest
        # Run outside the checkout so the installed wheels win over the
        # mufusion/mufusion and muraw/muraw sources.
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          python -m pytest "${GITHUB_WORKSPACE}/mufusion/tests" -v
          python -m pytest "${GITHUB_WORKSPACE}/muraw/tests" -v
