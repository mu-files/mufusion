name: Publish

# A v* tag publishes the files that ci.yml built and tested for the
# tagged commit on main. Push the commit to main and wait for that run to
# pass before pushing the tag. Its artifacts are kept for 90 days; an older
# commit needs a new run of ci.yml on main first.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Find the build run of the tagged commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --commit "$GITHUB_SHA" --status success \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "No passing ci.yml run on main for $GITHUB_SHA. Push the commit to main, wait for ci.yml to pass, then push the tag again." >&2
            exit 1
          fi
          echo "Publishing the artifacts of ci.yml run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # Publish the sdists and the Windows wheels of mufusion and muraw
      # only. macOS/Linux wheels are CI-only.
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
