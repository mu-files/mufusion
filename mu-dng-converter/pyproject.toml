[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mu-dng-converter"
version = "0.1.0"
description = "GUI application for batch DNG/FITS image conversion"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "mu-files", email = "info@mu-files.com"}]
requires-python = ">=3.12"
dependencies = [
    "pywebview>=4.0",
    "muraw[all]",
    "setproctitle",
    "astropy",
    "pyavm",
]

[project.scripts]
fits2dng = "mu_dng_converter.fits2dng:main"

[project.gui-scripts]
mu-dng-converter = "mu_dng_converter.app:main"

[tool.setuptools]
packages = ["mu_dng_converter"]

[tool.setuptools.package-data]
mu_dng_converter = ["web/*", "assets/*"]
