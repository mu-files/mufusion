[build-system]
requires = ["setuptools>=77", "wheel", "numpy>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "muraw-demosaic"
version = "0.1.20261114.1951"
description = "VNG and RCD demosaicing for muraw, built from source"
authors = [{name = "mu-files", email = "info@mu-files.com"}]
readme = "README.md"
requires-python = ">=3.12"
# The Python package is BSD-3-Clause and VNG is CDDL-1.0. RCD, which is
# built only when it is enabled, is GPL-3.0-or-later. See LICENSE.
license = "BSD-3-Clause AND CDDL-1.0"
license-files = ["LICENSE", "LICENSES/*"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
]
dependencies = [
    "numpy>=2",
]

[project.urls]
Homepage = "https://github.com/mu-files/mufusion/tree/main/muraw-demosaic"
Repository = "https://github.com/mu-files/mufusion"

[tool.setuptools]
packages = ["muraw_demosaic"]
